{% extends "base.html" %}
{% block content %}
  <a href="{{ url_for('index') }}" class="boton-volver" aria-label="Volver">&larr;</a>
  <h1 class="titulo-pagina">{{ config.titulo }}</h1>
  <p class="intro-pagina">{{ config.intro }}</p>

  <form method="post" class="formulario">
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <label class="campo-label" for="descripcion">{{ config.descripcion_label }}</label>
    <textarea id="descripcion" name="descripcion" rows="5" placeholder="Escribe aqui..."></textarea>

    <label class="campo-label" for="whatsapp">
      Tu WhatsApp{% if not config.whatsapp_obligatorio %} (opcional){% endif %}
    </label>
    <input type="tel" id="whatsapp" name="whatsapp" placeholder="10 digitos" {% if config.whatsapp_obligatorio %}required{% endif %}>
    <p class="ayuda">Lo usaremos solo para dar seguimiento a tu caso{% if not config.whatsapp_obligatorio %}, si hace falta{% endif %}.</p>

    <button type="submit" class="boton-enviar">Enviar reporte</button>
  </form>
{% endblock %}
